<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1016">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Anime Vault</title>
<style>
:root{--acc:#ff5c8a;--bg:#0f1016;--card:#1a1b26;--card2:#232436;--tx:#eceef7;--mu:#8e92ad;--bd:#2c2e45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif}
body{padding-bottom:96px}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 14px 8px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:.3px}
h1 span{color:var(--acc)}
#mb{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:42px;height:42px;font-size:22px}
input,select,textarea{width:100%;padding:11px 12px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;font-size:16px;font-family:inherit}
#q{margin-top:8px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.ch{flex:none;background:var(--card);color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:7px 12px;font-size:13px}
.ch b{color:var(--tx);margin-left:2px}
.ch.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ch.on b{color:#fff}
.ctl{display:flex;gap:8px;align-items:center;padding-top:6px}
.ctl select{padding:8px 10px;font-size:14px;flex:1;min-width:0}
#cnt{flex:none;font-size:12px;color:var(--mu)}
main{padding:12px 14px}
.cd{display:flex;gap:10px;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:14px;padding:12px;margin-bottom:10px}
.mn{min-width:0;flex:1}
.tt{font-weight:600;font-size:15px;line-height:1.3;word-break:break-word}
.mt{font-size:12px;color:var(--mu);margin-top:3px}
.tg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tg span{font-size:11px;background:var(--card2);color:var(--mu);padding:3px 8px;border-radius:10px}
.nt{font-size:12px;color:var(--mu);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.bd{background:transparent;color:var(--c);border:1px solid var(--c);border-radius:12px;padding:5px 10px;font-size:12px;font-weight:600}
.hr{background:none;border:0;color:var(--acc);font-size:24px;line-height:1;padding:2px 4px}
.empty{text-align:center;color:var(--mu);padding:60px 20px;line-height:1.6}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:9}
#ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:20}
#ov.on{display:flex}
#sh{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
#sh h3{margin:0 0 6px;font-size:18px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
.row{display:flex;gap:10px}
.row>div{flex:1;min-width:0}
.btn{display:block;width:100%;margin-top:10px;padding:13px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.dng{color:#ff7b7b}
.row .btn{margin-top:10px}
#gcs{display:flex;flex-wrap:wrap;gap:7px}
.gc{background:var(--bg);color:var(--mu);border:1px solid var(--bd);border-radius:16px;padding:6px 11px;font-size:13px}
.gc.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--tx);margin-top:14px}
.ck input{width:22px;height:22px}
.hint{font-size:12px;color:var(--mu);line-height:1.5;margin:8px 0}
.big{font-size:20px;font-weight:700;margin:10px 0 4px;line-height:1.3}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw i{width:38px;height:38px;border-radius:50%;border:2px solid var(--bd);display:block}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Anime <span>Vault</span></h1><button id="mb" aria-label="Menu">&#8942;</button></div>
  <input id="q" type="search" placeholder="Search title or genre..." autocomplete="off">
  <div id="chips"></div>
  <div class="ctl">
    <select id="sort" aria-label="Sort">
      <option value="order">My list order</option>
      <option value="az">A &rarr; Z</option>
      <option value="za">Z &rarr; A</option>
      <option value="rating">Rating (high)</option>
      <option value="recent">Recently updated</option>
      <option value="status">By status</option>
    </select>
    <select id="gsel" aria-label="Genre"></select>
    <span id="cnt"></span>
  </div>
</header>
<main id="list"></main>
<button id="fab" aria-label="Add anime">+</button>
<div id="ov"><div id="sh"></div></div>
<div id="toast"></div>

<script>
var G={R:'Romance',C:'Comedy',A:'Action',F:'Fantasy',D:'Drama',L:'Slice of Life',S:'Sci-Fi',E:'Ecchi',M:'Mystery',N:'Supernatural',U:'Music',T:'Sports'};
var ST=['Watching','Completed','Planned','On Hold','Dropped'];
var CY=['Planned','Watching','Completed','On Hold','Dropped'];
var SC={Watching:'#4da3ff',Completed:'#4cd48a',Planned:'#b08cff','On Hold':'#ffb84d',Dropped:'#ff6b6b'};
var COL=['#ff5c8a','#ff7a45','#f5c542','#4cd48a','#29c5d6','#4da3ff','#9b7bff','#e060e0'];
var KEY='animeVault.v1';
/* Title|genre letters|M = movie. Genre tags are best guesses - edit freely in the app. */
var SEED=[
"My Love Story with Yamada-kun at Lv999|RC","Alya Sometimes Hides Her Feelings in Russian|RC","Kaguya-sama: Love Is War|RC","Horimiya|RCL","The Fragrant Flower Blooms with Dignity|RL",
"The Angel Next Door Spoils Me Rotten|RCL","Gals Can't Be Kind to Otaku!?|RCE","I Made Friends to Second Prettiest Girl\u2014My Class|RCL","I Want to Eat This Love Game|","Rent-a-Girlfriend|RCE",
"Klutzy Class Monitor & the Girl with the Short Skirt|RC","Oh Boy, Was I Wrong About Her|","Weathering with You|RDN|M","Call of the Night|RCN","My Teen Romantic Comedy SNAFU|RCD",
"Teasing Master Takagi-san|RCL","I Want to Eat Your Pancreas|RD|M","More than a Married Couple, but Not Lovers.|RCE","The Dangers in My Heart|RCL","The Ice Guy and His Cool Female Colleague|RCL",
"Kimi ni Todoke: From Me to You|RDL","My Dress-Up Darling|RCE","Blue Box|RTD","You and I Are Polar Opposites|RCL","The Experienced You and The Inexperienced Me|RCE",
"The Girl I Like Forgot Her Glasses|RCL","Won't Let Me Be Invisible|","Real Girl|RC","Wotakoi: Love Is Hard for Otaku|RC","Tamako Love Story|RL|M",
"The Tunnel to Summer, the Exit of Goodbyes|RFD|M","TONIKAWA: Over The Moon For You|RC","Tsukigakirei|RDL","Lovely Complex|RC","The 100 Girlfriends Who Really, Really, Really, Really, Really Love You|RCE",
"ReLife|RCD","ORESUKI: Are you the only one who loves me?|RC","Hello World|RS|M","The Anthem of the Heart|DU|M","Himouto! Umaru-chan|CL",
"Skip and Loafer|RCL","Pseudo Harem|RC","The Day I Became a God|CDN","I'm Getting Married to a Girl I Hate in My Class|RC","Rich Girl Caretaker|RC",
"My Friend's Little Sister Has It In for Me!|RCE","Attack on Titan|ADF","Shikimori's Not Just a Cutie|RCL","The Foolish Angel Dances with the Devil|RCF","Love Election and Chocolate|RM",
"Girlfriend, Girlfriend|RCE","Momokuri|RCL","Studio Apartment, Good Lighting, Angel Included|RCN","The Unexpressive Kashiwada and the Expressive Oota|RCL","You are Ms. Servant|RC",
"Even a Replica Can Fall in Love|RS","Bottom-Tier Character Tomozaki|RCL","365 Days to the Wedding|RD","Days with My Stepsister|RL","True Tears|RD",
"And You Thought There Is Never a Girl Online?|RC","Gamers!|RC","Say \"I Love You\"|RD","Your Name|RDN|M","A Town Where You Live|RD",
"Toradora!|RCD","Golden Time|RCD","Josee, the Tiger and the Fish|RD|M","Anyway, I'm Falling in Love with You|RC","Love, Unseen Beneath the Clear Night Sky|R",
"The Devil is a Part-Timer!|ACF","Engage Kiss|AEF","Agents of the Four Seasons|FD","The Pet Girl of Sakurasou|RCD","Working!!|CL",
"I Can't Understand What My Husband Is Saying|RC","Boarding School Juliet|RC","Insomniacs After School|RL","Snow White with the Red Hair|RFD","Tomo-chan Is a Girl!|RC",
"You Can't Be in a Rom-Com with Your Childhood Friend|RC","Hanadori-san Still Wants to Fight in Next Life|","Maboroshi|DF|M","Love, Chunibyo & Other Delusions!|RCD","Aharen-san wa Hakarenai|RC",
"As Miss Beelzebub Likes|RF","Maid Sama!|RC","Monthly Girls' Nozaki-kun|RC","My Bride is a Mermaid|RCF","Rainbow Days|RL",
"Darling in the Franxx|ASRDE","Black Clover|ACF","Tying the Knot with an Amagami Sister|RCE","Amagami SS|RC","Love Me, Love Me Not|RDL",
"Fruits Basket|RDN","Tada Never Falls in Love|RC","Dealing with Mikadono Sisters Is a Breeze|RC","My Happy Marriage|RFD","Makeine: Too Many Losing Heroines!|RC",
"High School DxD|AEF","Please Put Them On, Takamine-san|CE","K-On!|CLU","My Instant Death Ability Is So Overpowered|ACF","The Yakuza's Guide to Babysitting|CL",
"Saekano: How to Raise a Boring Girlfriend|RC","Sparks of Tomorrow|","Chivalry of a Failed Knight|AEF","Net-juu no Susume (Recovery of an MMO Junkie)|RC","Senpai is an Otokonoko|RC",
"Bakemonogatari|RMN","Watari-kun's ****** is About to Collapse|RCE","O Maidens in Your Savage Season|RCD","A Whisker Away|RFD|M","Chitose Is in the Ramune Bottle|RCL"
];

function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function opts(a,v){return a.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')}
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function seed(){return SEED.map(function(s,i){var p=s.split('|');return{id:'s'+i,t:p[0],s:'Planned',r:0,g:(p[1]||'').split('').filter(function(c){return G[c]}).map(function(c){return G[c]}),ty:p[2]==='M'?'Movie':'TV',e:0,te:0,n:'',f:false,c:i,u:0}})}
function norm(x,i){return{id:x.id||uid(),t:String(x.t),s:ST.indexOf(x.s)>=0?x.s:'Planned',r:Math.min(10,Math.max(0,+x.r||0)),g:Array.isArray(x.g)?x.g.map(String):[],ty:x.ty?String(x.ty):'TV',e:+x.e||0,te:+x.te||0,n:x.n?String(x.n):'',f:!!x.f,c:typeof x.c==='number'?x.c:i,u:+x.u||0}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items)){d.items=d.items.map(norm);d.acc=d.acc||COL[0];return d}}catch(e){}return{items:seed(),acc:COL[0]}}
var db=load();
var view={q:'',st:'All',g:'All',sort:'order'};
var editing=null,pickId=null,tt;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save - storage full?')}}
function applyAcc(){document.documentElement.style.setProperty('--acc',db.acc)}
function find(id){return db.items.filter(function(i){return i.id===id})[0]}
function touch(x){x.u=Date.now();persist();render()}
function nextC(){return db.items.reduce(function(m,i){return Math.max(m,i.c)},-1)+1}
function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(function(){t.className=''},1900)}
function allGenres(){var s=Object.keys(G).map(function(k){return G[k]});db.items.forEach(function(x){x.g.forEach(function(g){if(s.indexOf(g)<0)s.push(g)})});return s}

function filtered(){
  var q=view.q.trim().toLowerCase();
  var a=db.items.filter(function(x){
    if(q&&x.t.toLowerCase().indexOf(q)<0&&x.g.join(' ').toLowerCase().indexOf(q)<0)return false;
    if(view.st==='Fav'){if(!x.f)return false}else if(view.st!=='All'&&x.s!==view.st)return false;
    if(view.g!=='All'&&x.g.indexOf(view.g)<0)return false;
    return true});
  var so={Watching:0,Planned:1,Completed:2,'On Hold':3,Dropped:4};
  var f={
    order:function(a,b){return a.c-b.c},
    az:function(a,b){return a.t.localeCompare(b.t)},
    za:function(a,b){return b.t.localeCompare(a.t)},
    rating:function(a,b){return b.r-a.r||a.t.localeCompare(b.t)},
    recent:function(a,b){return b.u-a.u||a.c-b.c},
    status:function(a,b){return so[a.s]-so[b.s]||a.t.localeCompare(b.t)}};
  return a.sort(f[view.sort]);
}
function card(x){
  var m=[x.ty];
  if(x.te||x.e)m.push(x.e+'/'+(x.te||'?')+' eps');
  if(x.r)m.push('\u2605 '+x.r);
  return '<div class="cd" data-id="'+x.id+'" style="--c:'+SC[x.s]+'"><div class="mn"><div class="tt">'+esc(x.t)+'</div><div class="mt">'+esc(m.join(' \u00b7 '))+'</div>'
   +(x.g.length?'<div class="tg">'+x.g.map(function(g){return '<span>'+esc(g)+'</span>'}).join('')+'</div>':'')
   +(x.n?'<div class="nt">'+esc(x.n)+'</div>':'')
   +'</div><div class="rt"><button class="bd" data-a="st">'+x.s+'</button><button class="hr" data-a="fav">'+(x.f?'\u2665':'\u2661')+'</button></div></div>';
}
function render(){
  var cnt={All:db.items.length,Fav:0};ST.forEach(function(s){cnt[s]=0});
  db.items.forEach(function(x){cnt[x.s]++;if(x.f)cnt.Fav++});
  $('chips').innerHTML=['All'].concat(ST,['Fav']).map(function(k){
    return '<button class="ch'+(view.st===k?' on':'')+'" data-st="'+k+'">'+(k==='Fav'?'\u2665 Favorites':k)+' <b>'+cnt[k]+'</b></button>'}).join('');
  var gl=allGenres();if(view.g!=='All'&&gl.indexOf(view.g)<0)view.g='All';
  $('gsel').innerHTML='<option value="All">All genres</option>'+gl.map(function(g){return '<option value="'+esc(g)+'">'+esc(g)+'</option>'}).join('');
  $('gsel').value=view.g;
  var list=filtered();
  $('cnt').textContent=list.length+' / '+db.items.length;
  $('list').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Nothing here.<br>Change the filters or tap + to add one.</div>';
}

/* ---------- sheet ---------- */
function openSheet(h){$('sh').innerHTML=h;$('ov').className='on';$('sh').scrollTop=0}
function closeSheet(){$('ov').className='';editing=null}
function edit(id){
  editing=id||null;
  var x=id?find(id):{t:'',s:'Planned',r:0,g:[],ty:'TV',e:0,te:0,n:'',f:false};
  var rs='<option value="0">Unrated</option>';for(var i=10;i>=1;i--)rs+='<option value="'+i+'"'+(x.r===i?' selected':'')+'>'+i+' / 10</option>';
  var gc=allGenres().map(function(g){return '<button type="button" class="gc'+(x.g.indexOf(g)>=0?' on':'')+'" data-g="'+esc(g)+'">'+esc(g)+'</button>'}).join('');
  openSheet('<h3>'+(id?'Edit anime':'Add anime')+'</h3>'
   +'<label>Title</label><input id="f_t" value="'+esc(x.t)+'" autocomplete="off">'
   +'<div class="row"><div><label>Status</label><select id="f_s">'+opts(ST,x.s)+'</select></div><div><label>Rating</label><select id="f_r">'+rs+'</select></div></div>'
   +'<div class="row"><div><label>Type</label><select id="f_ty">'+opts(['TV','Movie','OVA','ONA','Special'],x.ty)+'</select></div>'
   +'<div><label>Eps watched</label><input id="f_e" type="number" min="0" inputmode="numeric" value="'+x.e+'"></div>'
   +'<div><label>Total eps</label><input id="f_te" type="number" min="0" inputmode="numeric" value="'+x.te+'"></div></div>'
   +'<label>Genres / tags</label><div id="gcs">'+gc+'</div>'
   +'<div class="row" style="margin-top:8px"><div><input id="f_nt" placeholder="New tag..." autocomplete="off"></div><div style="flex:none;width:90px"><button type="button" class="btn" style="margin:0;padding:11px" data-act="addtag">Add</button></div></div>'
   +'<label>Notes</label><textarea id="f_n" rows="3">'+esc(x.n)+'</textarea>'
   +'<label class="ck"><input type="checkbox" id="f_f"'+(x.f?' checked':'')+'> Favorite</label>'
   +'<button class="btn pri" data-act="save">Save</button>'
   +(id?'<button class="btn dng" data-act="del">Delete</button>':'')
   +'<button class="btn" data-act="cancel">Cancel</button>');
}
function menu(){
  openSheet('<h3>Menu</h3>'
   +'<button class="btn" data-act="random">\ud83c\udfb2 Random pick from Planned</button>'
   +'<button class="btn" data-act="backup">\ud83d\udcbe Backup &amp; restore</button>'
   +'<label>Accent color</label><div class="sw">'+COL.map(function(c){return '<i data-act="color" data-c="'+c+'" style="background:'+c+'"></i>'}).join('')+'</div>'
   +'<button class="btn dng" data-act="reset">\u267b Reset to starter list</button>'
   +'<p class="hint">Your list is stored only on this phone, inside the app. Use Backup now and then, especially before clearing Chrome data or uninstalling.</p>'
   +'<button class="btn" data-act="cancel">Close</button>');
}
function backupJSON(){return JSON.stringify({app:'anime-vault',v:1,exported:new Date().toISOString(),acc:db.acc,items:db.items},null,1)}
function backup(){
  openSheet('<h3>Backup &amp; restore</h3>'
   +'<p class="hint">Download the file or copy the text and keep it safe. To restore: choose a backup file, or paste backup text into the box and tap Restore.</p>'
   +'<textarea id="bk" rows="6">'+esc(backupJSON())+'</textarea>'
   +'<div class="row"><button class="btn" data-act="dl">\u2b07 Download file</button><button class="btn" data-act="copy">Copy text</button></div>'
   +'<label>Restore from a backup file</label><input type="file" id="bkf" accept=".json,application/json,text/plain">'
   +'<button class="btn dng" data-act="restoretext">Restore from text box</button>'
   +'<button class="btn" data-act="cancel">Close</button>');
}
function doRestore(txt){
  var d;try{d=JSON.parse(txt)}catch(e){toast('Not a valid backup');return}
  var arr=Array.isArray(d)?d:(d&&d.items);
  if(!Array.isArray(arr)||!arr.length||arr.some(function(x){return !x||typeof x.t!=='string'})){toast('No valid list in that backup');return}
  if(!confirm('Replace your current list with '+arr.length+' anime from this backup?'))return;
  db.items=arr.map(norm);if(d&&d.acc)db.acc=d.acc;
  applyAcc();persist();closeSheet();render();toast('Restored '+arr.length+' anime');
}
function pick(){
  var pool=db.items.filter(function(x){return x.s==='Planned'});
  if(!pool.length)pool=db.items;
  if(!pool.length){toast('Your list is empty');return}
  var x=pool[Math.floor(Math.random()*pool.length)];pickId=x.id;
  openSheet('<h3>\ud83c\udfb2 How about this one?</h3><div class="big">'+esc(x.t)+'</div>'
   +'<div class="mt" style="font-size:13px;color:var(--mu)">'+esc(x.ty)+(x.g.length?' \u00b7 '+esc(x.g.join(', ')):'')+'</div>'
   +'<button class="btn pri" data-act="start">Start watching</button>'
   +'<button class="btn" data-act="random">Pick another</button>'
   +'<button class="btn" data-act="cancel">Close</button>');
}
var acts={
  cancel:function(){closeSheet()},
  addtag:function(){
    var i=$('f_nt'),v=i.value.trim();if(!v)return;
    var ex=[].slice.call(document.querySelectorAll('#gcs .gc')).filter(function(b){return b.getAttribute('data-g').toLowerCase()===v.toLowerCase()})[0];
    if(ex){ex.classList.add('on')}else{var b=document.createElement('button');b.type='button';b.className='gc on';b.setAttribute('data-g',v);b.textContent=v;$('gcs').appendChild(b)}
    i.value='';
  },
  save:function(){
    var t=$('f_t').value.trim();if(!t){toast('Enter a title');return}
    var g=[].slice.call(document.querySelectorAll('#gcs .gc.on')).map(function(b){return b.getAttribute('data-g')});
    var x=editing?find(editing):null,isNew=!x;
    if(isNew){x={id:uid(),c:nextC()};db.items.push(x)}
    x.t=t;x.s=$('f_s').value;x.r=+$('f_r').value;x.ty=$('f_ty').value;
    x.e=Math.max(0,+$('f_e').value||0);x.te=Math.max(0,+$('f_te').value||0);
    x.g=g;x.n=$('f_n').value.trim();x.f=$('f_f').checked;x.u=Date.now();
    persist();closeSheet();render();toast(isNew?'Added':'Saved');
  },
  del:function(){
    var x=editing?find(editing):null;if(!x)return;
    if(!confirm('Delete "'+x.t+'"?'))return;
    db.items=db.items.filter(function(i){return i.id!==x.id});
    persist();closeSheet();render();toast('Deleted');
  },
  random:pick,
  start:function(){var x=find(pickId);if(x){x.s='Watching';touch(x);toast('Enjoy!')}closeSheet()},
  backup:backup,
  dl:function(){
    var b=new Blob([backupJSON()],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='anime-vault-backup.json';document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove()},800);toast('Saving backup file...');
  },
  copy:function(){var t=$('bk');t.focus();t.select();try{t.setSelectionRange(0,t.value.length)}catch(e){}
    try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select all and copy manually')}},
  restoretext:function(){doRestore($('bk').value)},
  color:function(b){db.acc=b.getAttribute('data-c');applyAcc();persist();toast('Color changed')},
  reset:function(){
    if(!confirm('Replace your whole list with the original starter list? This erases all your changes.'))return;
    db.items=seed();persist();closeSheet();render();toast('List reset');
  }
};

/* ---------- events ---------- */
$('sh').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(b){var f=acts[b.getAttribute('data-act')];if(f)f(b);return}
  var g=e.target.closest('.gc');if(g)g.classList.toggle('on');
});
$('sh').addEventListener('change',function(e){
  if(e.target.id==='bkf'){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){doRestore(String(r.result))};r.readAsText(f)}
});
$('ov').addEventListener('click',function(e){if(e.target===$('ov'))closeSheet()});
$('list').addEventListener('click',function(e){
  var c=e.target.closest('.cd');if(!c)return;
  var id=c.getAttribute('data-id'),x=find(id);if(!x)return;
  var a=e.target.closest('[data-a]'),k=a&&a.getAttribute('data-a');
  if(k==='st'){x.s=CY[(CY.indexOf(x.s)+1)%CY.length];if(x.s==='Completed'&&x.te)x.e=x.te;touch(x);return}
  if(k==='fav'){x.f=!x.f;touch(x);return}
  edit(id);
});
$('chips').addEventListener('click',function(e){var b=e.target.closest('[data-st]');if(b){view.st=b.getAttribute('data-st');render()}});
$('q').addEventListener('input',function(){view.q=this.value;render()});
$('sort').addEventListener('change',function(){view.sort=this.value;render()});
$('gsel').addEventListener('change',function(){view.g=this.value;render()});
$('fab').addEventListener('click',function(){edit(null)});
$('mb').addEventListener('click',menu);

applyAcc();render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>

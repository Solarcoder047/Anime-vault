name: Build Anime Vault APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Keeps the same signing key between builds so new versions can install over old ones.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: anime-vault-signing-key-v1

      - name: Create Android project
        run: |
          set -e
          P=android
          A=$P/app/src/main
          mkdir -p $A/assets $A/java/com/animevault/app $A/res/drawable $A/res/values
          cp index.html $A/assets/index.html

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AnimeVault"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.animevault.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.animevault.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Anime Vault"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $A/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0F1016</item>
                  <item name="android:statusBarColor">#0F1016</item>
                  <item name="android:navigationBarColor">#0F1016</item>
              </style>
          </resources>
          EOF

          cat > $A/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#14151F" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FF5C8A" android:pathData="M54,54m-34,0a34,34 0 1,1 68,0a34,34 0 1,1 -68,0" />
              <path android:fillColor="#FFFFFF" android:pathData="M45,38L45,70L72,54Z" />
          </vector>
          EOF

          cat > $A/java/com/animevault/app/MainActivity.java <<'EOF'
          package com.animevault.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0F1016"));
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setTextZoom(100);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.__back && window.__back()) ? '1' : '0'", v -> {
                      if (!"\"1\"".equals(v)) finish();
                  });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              class Bridge {
                  @JavascriptInterface
                  public void share(final String text) {
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_SEND);
                          i.setType("text/plain");
                          i.putExtra(Intent.EXTRA_SUBJECT, "Anime Vault backup");
                          i.putExtra(Intent.EXTRA_TEXT, text);
                          startActivity(Intent.createChooser(i, "Save backup to..."));
                      });
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Anime-Vault.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Anime Vault v${{ github.run_number }}
          body: Tap Anime-Vault.apk below to download and install.
          files: Anime-Vault.apk
